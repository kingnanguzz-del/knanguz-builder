<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess</title>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
import React, { useState, useEffect } from 'react';

// --- TACTICS PUZZLE DATABASE ---
// We use a simplified 8x8 grid. 'null' means empty. 
// Standard pieces: R, N, B, Q, K, P (White) / r, n, b, q, k, p (Black)
const tacticsPuzzles = [
  {
    id: 1,
    title: "The Royal Fork",
    instruction: "Move your White Knight to fork the Black King and Black Queen.",
    // A simplified board showing just the relevant pieces
    initialBoard: [
      [null, null, null, null, 'k', null, null, null], // Row 0
      [null, null, 'q', null, null, null, null, null], // Row 1
      [null, null, null, null, null, null, null, null], // Row 2
      [null, null, null, null, null, null, null, null], // Row 3
      [null, null, null, null, 'N', null, null, null], // Row 4 (Knight is at e4)
      [null, null, null, null, null, null, null, null], // Row 5
      [null, null, null, null, null, null, null, null], // Row 6
      [null, null, null, null, null, null, null, null], // Row 7
    ],
    // The winning move: Knight moves to c5 (Row 3, Col 2) to fork King(e8) and Queen(c7)
    winningMove: { from: { r: 4, c: 4 }, to: { r: 2, c: 2 } },
    successMsg: "Brilliant! You attacked both the King and Queen simultaneously."
  },
  {
    id: 2,
    title: "The Deadly Pin",
    instruction: "Move your White Bishop to pin the Black Knight to the Black King.",
    initialBoard: [
      [null, null, null, null, null, null, null, 'k'], // Row 0 (King at h8)
      [null, null, null, null, null, null, 'n', null], // Row 1 (Knight at g7)
      [null, null, null, null, null, null, null, null], // Row 2
      [null, null, null, null, null, null, null, null], // Row 3
      [null, null, null, null, null, null, null, null], // Row 4
      [null, 'B', null, null, null, null, null, null], // Row 5 (Bishop at b3)
      [null, null, null, null, null, null, null, null], // Row 6
      [null, null, null, null, null, null, null, null], // Row 7
    ],
    // Bishop moves to d5 (Row 3, Col 3) to pin the knight on the h8 diagonal
    winningMove: { from: { r: 5, c: 1 }, to: { r: 3, c: 3 } },
    successMsg: "Excellent! The Black Knight cannot move without exposing the King."
  },
  {
    id: 3,
    title: "Mate in 1",
    instruction: "Deliver Checkmate with your White Queen.",
    initialBoard: [
      ['k', null, null, null, null, null, null, null], // Row 0 (King at a8)
      ['p', 'p', null, null, null, null, null, null], // Row 1 (Pawns blocking escape)
      [null, 'K', null, null, null, null, null, null], // Row 2 (White King at b6 supporting)
      [null, null, null, null, null, null, null, null], // Row 3
      [null, null, null, null, null, null, null, null], // Row 4
      [null, null, null, null, null, null, null, null], // Row 5
      [null, null, null, null, null, null, null, null], // Row 6
      [null, null, null, null, null, null, null, 'Q'], // Row 7 (Queen at h1)
    ],
    // Queen moves to a1 (Row 7, Col 0) to h8 (Row 0, Col 7) - wait, let's just go h1 to a8
    // Actually, Queen to a7 (Row 1, Col 0) is supported by King and is mate.
    winningMove: { from: { r: 7, c: 7 }, to: { r: 1, c: 0 } },
    successMsg: "Checkmate! The system is complete."
  }
];

const pieceSymbols = {
  r: '♜', n: '♞', b: '♝', q: '♛', k: '♚', p: '♟', 
  R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔', P: '♙', 
};

const ChessLearnerApp = () => {
  const [currentPhase, setCurrentPhase] = useState(5); // Default to Phase 5 for testing

  const renderPhaseContent = () => {
    switch (currentPhase) {
      case 1: return <Phase1Basics />;
      case 2: return <Phase2Openings />;
      case 3: return <Phase3Tactics />;
      case 4: return <Phase4Test />;
      case 5: return <Phase5TacticsEngine />;
      default: return <Phase1Basics />;
    }
  };

  return (
    <div style={styles.appContainer}>
      <header style={styles.header}>
        <h1 style={styles.title}>Chess Mastery</h1>
        <p style={styles.subtitle}>Interactive Learning System</p>
      </header>
      <nav style={styles.nav}>
        {[1, 2, 3, 4, 5].map((num) => (
          <button
            key={num}
            onClick={() => setCurrentPhase(num)}
            style={{
              ...styles.navButton,
              backgroundColor: currentPhase === num ? '#4CAF50' : '#333',
            }}
          >
            Phase {num}
          </button>
        ))}
      </nav>
      <main style={styles.mainContent}>
        {renderPhaseContent()}
      </main>
    </div>
  );
};

// --- Phases 1-4 (Condensed for space, unchanged logic) ---
const Phase1Basics = () => (
  <div style={styles.section}><h2>Phase 1: Basics</h2><p>Learn piece movements.</p></div>
);
const Phase2Openings = () => (
  <div style={styles.section}><h2>Phase 2: Openings</h2><p>Control the center, develop pieces, castle.</p></div>
);
const Phase3Tactics = () => (
  <div style={styles.section}><h2>Phase 3: Tactics Concepts</h2><p>Learn Forks, Pins, and Skewers before practicing them.</p></div>
);
const Phase4Test = () => (
  <div style={styles.section}><h2>Phase 4: Quiz</h2><p>Multiple choice tests go here.</p></div>
);

// --- Phase 5: The Interactive Tactics Engine ---
const Phase5TacticsEngine = () => {
  const [puzzleIndex, setPuzzleIndex] = useState(0);
  const puzzle = tacticsPuzzles[puzzleIndex];
  
  // Clone the initial board so we can manipulate it
  const [board, setBoard] = useState([]);
  const [selectedSquare, setSelectedSquare] = useState(null);
  const [feedback, setFeedback] = useState("");
  const [isSuccess, setIsSuccess] = useState(false);

  // Load the puzzle board whenever the puzzle changes
  useEffect(() => {
    setBoard(puzzle.initialBoard.map(row => [...row]));
    setSelectedSquare(null);
    setFeedback("");
    setIsSuccess(false);
  }, [puzzleIndex, puzzle]);

  const handleSquareClick = (r, c) => {
    if (isSuccess) return; // Prevent moves after winning
    const clickedPiece = board[r][c];
    
    // 1. Select a piece
    if (!selectedSquare) {
      if (clickedPiece && clickedPiece === clickedPiece.toUpperCase()) { // Only allow selecting White pieces
        setSelectedSquare({ r, c });
      }
      return;
    }

    // 2. Deselect if clicking the same square
    if (selectedSquare.r === r && selectedSquare.c === c) {
      setSelectedSquare(null);
      return;
    }

    // 3. Attempt a move
    const isCorrectMove = 
      selectedSquare.r === puzzle.winningMove.from.r &&
      selectedSquare.c === puzzle.winningMove.from.c &&
      r === puzzle.winningMove.to.r &&
      c === puzzle.winningMove.to.c;

    if (isCorrectMove) {
      // Execute move visually
      const newBoard = board.map(row => [...row]);
      newBoard[r][c] = newBoard[selectedSquare.r][selectedSquare.c];
      newBoard[selectedSquare.r][selectedSquare.c] = null;
      setBoard(newBoard);
      
      setFeedback(puzzle.successMsg);
      setIsSuccess(true);
      setSelectedSquare(null);
    } else {
      // Wrong move - flash error and reset selection
      setFeedback("Incorrect tactic. Try again!");
      setSelectedSquare(null);
      setTimeout(() => setFeedback(""), 2000);
    }
  };

  const nextPuzzle = () => {
    if (puzzleIndex < tacticsPuzzles.length - 1) {
      setPuzzleIndex(puzzleIndex + 1);
    } else {
      setFeedback("All tactics completed! You are a master.");
    }
  };

  return (
    <div style={styles.section}>
      <h2>Phase 5: Live Tactics</h2>
      <div style={styles.puzzleInfo}>
        <h3 style={{color: '#f39c12', margin: '0 0 10px 0'}}>{puzzle.title}</h3>
        <p style={{margin: 0}}>{puzzle.instruction}</p>
      </div>
      
      {feedback && (
        <div style={{...styles.feedback, backgroundColor: isSuccess ? '#27ae60' : '#c0392b'}}>
          {feedback}
        </div>
      )}

      <div style={styles.boardContainer}>
        <div style={styles.chessBoard}>
          {board.map((row, rIndex) => (
            row.map((piece, cIndex) => {
              const isDark = (rIndex + cIndex) % 2 !== 0;
              const isSelected = selectedSquare?.r === rIndex && selectedSquare?.c === cIndex;
              return (
                <div 
                  key={`${rIndex}-${cIndex}`}
                  onClick={() => handleSquareClick(rIndex, cIndex)}
                  style={{
                    width: '12.5%', 
                    height: '12.5%', 
                    backgroundColor: isSelected ? '#f1c40f' : (isDark ? '#769656' : '#eeeed2'),
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: '28px', cursor: 'pointer', userSelect: 'none'
                  }}
                >
                  {piece ? pieceSymbols[piece] : ''}
                </div>
              );
            })
          ))}
        </div>
      </div>

      {isSuccess && puzzleIndex < tacticsPuzzles.length - 1 && (
        <button style={styles.nextButton} onClick={nextPuzzle}>
          Next Tactic ➔
        </button>
      )}
    </div>
  );
};

// --- Styles ---
const styles = {
  appContainer: { fontFamily: 'system-ui, sans-serif', maxWidth: '100%', margin: '0 auto', backgroundColor: '#1a1a1a', color: '#fff', minHeight: '100vh', display: 'flex', flexDirection: 'column' },
  header: { padding: '15px', textAlign: 'center', backgroundColor: '#2d2d2d', borderBottom: '2px solid #4CAF50' },
  title: { margin: 0, fontSize: '22px', color: '#4CAF50' },
  subtitle: { margin: '5px 0 0 0', fontSize: '14px', color: '#aaa' },
  nav: { display: 'flex', overflowX: 'auto', padding: '10px', backgroundColor: '#222', gap: '8px' },
  navButton: { flex: '1 0 auto', padding: '12px 15px', color: 'white', border: 'none', borderRadius: '5px', fontWeight: 'bold' },
  mainContent: { padding: '20px', flex: 1 },
  section: { animation: 'fadeIn 0.3s ease-in' },
  puzzleInfo: { backgroundColor: '#2d2d2d', padding: '15px', borderRadius: '8px', marginBottom: '15px', borderLeft: '4px solid #f39c12' },
  feedback: { padding: '10px', borderRadius: '5px', textAlign: 'center', marginBottom: '15px', fontWeight: 'bold' },
  boardContainer: { width: '100%', maxWidth: '400px', margin: '0 auto', aspectRatio: '1 / 1' },
  chessBoard: { width: '100%', height: '100%', display: 'flex', flexWrap: 'wrap', border: '4px solid #333', borderRadius: '4px' },
  nextButton: { width: '100%', padding: '15px', marginTop: '20px', backgroundColor: '#2980b9', color: 'white', border: 'none', borderRadius: '5px', fontSize: '16px', fontWeight: 'bold' }
};

export default ChessLearnerApp;

const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(React.createElement(App));
</script>
</body></html>
