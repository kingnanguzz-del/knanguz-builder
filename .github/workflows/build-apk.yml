name: Build APK

on:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_ID: ${{ github.event.client_payload.build_id }}
      APP_NAME: ${{ github.event.client_payload.app_name }}
      PACKAGE_ID: ${{ github.event.client_payload.package_id }}
      PAYLOAD_PATH: ${{ github.event.client_payload.payload_path }}
      ZIP_PATH: ${{ github.event.client_payload.zip_path }}
      ICON_PATH: ${{ github.event.client_payload.icon_path }}
      FRAMEWORK: ${{ github.event.client_payload.framework }}
      BUILD_CONFIG: ${{ github.event.client_payload.build_config }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report build started
        run: |
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.BUILD_CALLBACK_SECRET }}" \
            -d "{\"build_id\":\"$BUILD_ID\",\"status\":\"building\"}" || true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Scaffold Capacitor project
        run: |
          set -e
          mkdir -p mobile-project/www
          cd mobile-project
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=www

      - name: Inject web assets
        run: |
          set -e
          BUILD_INSTALL=$(echo "$BUILD_CONFIG" | cut -d'|' -f1)
          BUILD_CMD=$(echo "$BUILD_CONFIG" | cut -d'|' -f3)
          BUILD_OUT_DIR=$(echo "$BUILD_CONFIG" | cut -d'|' -f5)

          if [ -n "$ZIP_PATH" ] && [ -f "$ZIP_PATH" ]; then
            echo "ZIP build detected — framework: $FRAMEWORK"
            mkdir -p /tmp/project
            unzip -o "$ZIP_PATH" -d /tmp/project

            ROOT=$(find /tmp/project -name "package.json" \
              -not -path "*/node_modules/*" | head -1 | xargs dirname 2>/dev/null || echo "/tmp/project")
            echo "Project root: $ROOT"
            cd "$ROOT"

            if [ -n "$BUILD_INSTALL" ] && [ -f "package.json" ]; then
              echo "Running: $BUILD_INSTALL"
              eval "$BUILD_INSTALL"
            fi

            if [ -n "$BUILD_CMD" ] && [ -f "package.json" ]; then
              echo "Running: $BUILD_CMD"
              eval "$BUILD_CMD" || true
            fi

            OUT=""
            for TRY in "$BUILD_OUT_DIR" dist build out public www .; do
              if [ -d "$TRY" ] && [ "$(ls -A $TRY)" ]; then OUT="$TRY"; break; fi
            done

            if [ -n "$OUT" ]; then
              echo "Copying $OUT to www"
              cp -r "$OUT/." "$GITHUB_WORKSPACE/mobile-project/www/"
            else
              echo "Copying all files to www"
              cp -r . "$GITHUB_WORKSPACE/mobile-project/www/"
            fi
          else
            echo "Code build — injecting index.html"
            cp "$PAYLOAD_PATH" mobile-project/www/index.html
          fi

          echo "Web assets injected successfully"

      - name: Add Android platform
        working-directory: mobile-project
        run: |
          set -e
          npx cap add android
          npx cap sync android
          cat >> android/build.gradle << 'EOF'
          allprojects {
            configurations.all {
              resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
            }
          }
          EOF

      - name: Inject app icon
        run: |
          set -e
          echo "ICON_PATH value: '$ICON_PATH'"
          ls -la "builds/$BUILD_ID" || true

          RES="mobile-project/android/app/src/main/res"

          if [ -n "$ICON_PATH" ] && [ -f "$ICON_PATH" ]; then
            echo "Using user uploaded icon: $ICON_PATH"
            convert "${ICON_PATH}[0]" -background none /tmp/icon_raw.png
          else
            echo "No user icon found — generating default knanGuz icon"
            convert -size 1024x1024 xc:#0f172a \
              -fill "#065f46" -draw "circle 512,512 512,200" \
              -fill "#34d399" -font DejaVu-Sans-Bold \
              -pointsize 420 -gravity Center \
              -annotate 0 "kG" \
              /tmp/icon_raw.png
          fi

          # Crop to a perfect square (fills the frame, centered)
          convert /tmp/icon_raw.png \
            -resize 1024x1024^ -gravity Center -extent 1024x1024 \
            /tmp/icon_square.png

          # IMPORTANT: remove Capacitor's adaptive icon definition.
          # Android 8+ prefers it over the PNGs, which is why custom
          # icons never showed up. Deleting it forces Android to use ours.
          rm -rf "$RES/mipmap-anydpi-v26"
          echo "Removed adaptive icon definition"

          for ENTRY in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            DENSITY="${ENTRY%%:*}"
            SIZE="${ENTRY##*:}"
            DIR="$RES/mipmap-$DENSITY"
            mkdir -p "$DIR"
            convert /tmp/icon_square.png -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher.png"
            cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
            cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_foreground.png"
            echo "Placed ${SIZE}px icon in mipmap-$DENSITY"
          done

          echo "All icons placed"

      - name: Build APK with Gradle
        working-directory: mobile-project/android
        run: |
          set -e
          chmod +x ./gradlew

          WRAP=gradle/wrapper/gradle-wrapper.properties
          GV=$(grep -oP 'gradle-\K[0-9.]+(?=-)' "$WRAP" | head -1)
          GV=${GV:-8.11.1}
          echo "Gradle version needed: $GV"

          # Download Gradle ourselves from several sources (the official one
          # sometimes returns HTTP 504), then point the wrapper at the file.
          ZIP="/tmp/gradle-${GV}-bin.zip"
          GOT=0
          for URL in \
            "https://services.gradle.org/distributions/gradle-${GV}-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-${GV}-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-${GV}-bin.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-${GV}-bin.zip"; do
            echo "Trying $URL"
            if curl -fL --retry 3 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 20 --max-time 400 -o "$ZIP" "$URL" \
               && unzip -tq "$ZIP" > /dev/null 2>&1; then
              GOT=1
              echo "Downloaded OK from $URL"
              break
            fi
            echo "Failed, trying next source"
            rm -f "$ZIP"
          done

          if [ "$GOT" = "1" ]; then
            cat > "$WRAP" <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=file\:///tmp/gradle-${GV}-bin.zip
          networkTimeout=180000
          validateDistributionUrl=false
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          else
            echo "All sources failed - falling back to the default wrapper download"
            sed -i 's/^networkTimeout=.*/networkTimeout=180000/' "$WRAP"
            sed -i 's/-all\.zip/-bin.zip/' "$WRAP"
          fi
          cat "$WRAP"

          # Longer timeouts for dependency downloads too
          echo "systemProp.org.gradle.internal.http.connectionTimeout=180000" >> gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=180000" >> gradle.properties

          # Try up to 3 times in case a download hiccups
          OK=0
          for ATTEMPT in 1 2 3; do
            echo "=== Gradle attempt $ATTEMPT of 3 ==="
            if ./gradlew assembleRelease --no-daemon; then OK=1; break; fi
            echo "Attempt $ATTEMPT failed - retrying in 20s"
            sleep 20
          done
          if [ "$OK" != "1" ]; then echo "Gradle failed after 3 attempts"; exit 1; fi

      - name: Sign APK
        working-directory: mobile-project/android
        run: |
          set -e
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/${APP_NAME// /-}-signed.apk"
          KEYSTORE="knanguz-release.keystore"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias knanguzkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass knanguz123 -keypass knanguz123 \
            -dname "CN=knanGuz, OU=CloudBuild, O=knanGuz, L=Nairobi, S=Nairobi, C=KE"

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)

          "${BUILD_TOOLS_DIR}zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "${BUILD_TOOLS_DIR}apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:knanguz123 \
            --key-pass pass:knanguz123 \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "SIGNED_APK_PATH=mobile-project/android/${SIGNED_APK}" >> "$GITHUB_ENV"

      - name: Create GitHub Release with APK
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_ID }}
          name: "knanGuz build ${{ env.BUILD_ID }} — ${{ env.APP_NAME }}"
          body: "Build for ${{ env.APP_NAME }} (${{ env.PACKAGE_ID }}) — Framework: ${{ env.FRAMEWORK }}"
          files: ${{ env.SIGNED_APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report build success
        if: success()
        run: |
          FILENAME=$(basename "$SIGNED_APK_PATH")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/build-${BUILD_ID}/${FILENAME}"
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.BUILD_CALLBACK_SECRET }}" \
            -d "{\"build_id\":\"$BUILD_ID\",\"status\":\"success\",\"download_url\":\"$DOWNLOAD_URL\"}"

      - name: Report build failure
        if: failure()
        run: |
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.BUILD_CALLBACK_SECRET }}" \
            -d "{\"build_id\":\"$BUILD_ID\",\"status\":\"failed\",\"error\":\"Build failed — check Actions logs.\"}"

      - name: Clean up payload files
        if: always()
        run: |
          git config user.name "knanguz-bot"
          git config user.email "bot@knanguz.local"
          [ -n "$PAYLOAD_PATH" ] && git rm -f "$PAYLOAD_PATH" || true
          [ -n "$ZIP_PATH" ] && git rm -f "$ZIP_PATH" || true
          [ -n "$ICON_PATH" ] && git rm -f "$ICON_PATH" || true
          git commit -m "knanGuz: clean up payload for $BUILD_ID" || true
          git push || true
