name: Build APK

on:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_ID: ${{ github.event.client_payload.build_id }}
      APP_NAME: ${{ github.event.client_payload.app_name }}
      PACKAGE_ID: ${{ github.event.client_payload.package_id }}
      PAYLOAD_PATH: ${{ github.event.client_payload.payload_path }}
      ICON_PATH: ${{ github.event.client_payload.icon_path }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
      CALLBACK_SECRET: ${{ secrets.BUILD_CALLBACK_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report build started
        run: |
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CALLBACK_SECRET" \
            -d "{\"build_id\":\"$BUILD_ID\",\"status\":\"building\"}" || true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Scaffold Capacitor project
        run: |
          set -e
          mkdir -p mobile-project/www
          cd mobile-project
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=www

      - name: Inject user code
        run: |
          set -e
          cp "$PAYLOAD_PATH" mobile-project/www/index.html
          echo "HTML injected successfully"

      - name: Add Android platform
        working-directory: mobile-project
        run: |
          set -e
          npx cap add android
          npx cap sync android
          cat >> android/build.gradle << 'EOF'
          allprojects {
            configurations.all {
              resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
            }
          }
          EOF

      - name: Inject app icon
        run: |
          set -e

          # All Android icon sizes needed
          declare -A SIZES=(
            ["mobile-project/android/app/src/main/res/mipmap-mdpi"]=48
            ["mobile-project/android/app/src/main/res/mipmap-hdpi"]=72
            ["mobile-project/android/app/src/main/res/mipmap-xhdpi"]=96
            ["mobile-project/android/app/src/main/res/mipmap-xxhdpi"]=144
            ["mobile-project/android/app/src/main/res/mipmap-xxxhdpi"]=192
          )

          # Decide which icon to use
          if [ -n "$ICON_PATH" ] && [ -f "$ICON_PATH" ]; then
            echo "Using user uploaded icon: $ICON_PATH"
            SOURCE="$ICON_PATH"

            # Convert any format (jpg/webp/png) to png first
            convert "$SOURCE" /tmp/icon_source.png
            SOURCE="/tmp/icon_source.png"
          else
            echo "No user icon — generating default knanGuz icon"
            convert -size 1024x1024 xc:#0f172a \
              -fill "#065f46" -draw "circle 512,512 512,200" \
              -fill "#34d399" -font DejaVu-Sans-Bold \
              -pointsize 420 -gravity Center \
              -annotate 0 "kG" \
              /tmp/icon_source.png
            SOURCE="/tmp/icon_source.png"
          fi

          # Make it square by cropping to center
          convert "$SOURCE" \
            -gravity Center \
            -extent "$(identify -format '%[fx:min(w,h)]x%[fx:min(w,h)]' "$SOURCE")" \
            /tmp/icon_square.png
          SOURCE="/tmp/icon_square.png"

          # Resize into every mipmap folder
          for DIR in "${!SIZES[@]}"; do
            SIZE="${SIZES[$DIR]}"
            mkdir -p "$DIR"
            convert "$SOURCE" \
              -resize "${SIZE}x${SIZE}" \
              -gravity Center \
              -extent "${SIZE}x${SIZE}" \
              "${DIR}/ic_launcher.png"
            cp "${DIR}/ic_launcher.png" "${DIR}/ic_launcher_round.png"
            echo "Placed ${SIZE}px icon in $DIR"
          done

          echo "All icons placed successfully"

      - name: Build APK with Gradle
        working-directory: mobile-project/android
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        working-directory: mobile-project/android
        run: |
          set -e
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/${APP_NAME// /-}-signed.apk"
          KEYSTORE="knanguz-release.keystore"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias knanguzkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass knanguz123 -keypass knanguz123 \
            -dname "CN=knanGuz, OU=CloudBuild, O=knanGuz, L=Nairobi, S=Nairobi, C=KE"

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)

          "${BUILD_TOOLS_DIR}zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "${BUILD_TOOLS_DIR}apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:knanguz123 \
            --key-pass pass:knanguz123 \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "SIGNED_APK_PATH=mobile-project/android/${SIGNED_APK}" >> "$GITHUB_ENV"

      - name: Create GitHub Release with APK
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_ID }}
          name: "knanGuz build ${{ env.BUILD_ID }} — ${{ env.APP_NAME }}"
          body: "Automated cloud build for ${{ env.APP_NAME }} (${{ env.PACKAGE_ID }})."
          files: ${{ env.SIGNED_APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report build success
        if: success()
        run: |
          FILENAME=$(basename "$SIGNED_APK_PATH")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/build-${BUILD_ID}/${FILENAME}"
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CALLBACK_SECRET" \
            -d "{\"build_id\":\"$BUILD_ID\",\"status\":\"success\",\"download_url\":\"$DOWNLOAD_URL\"}"

      - name: Report build failure
        if: failure()
        run: |
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CALLBACK_SECRET" \
            -d "{\"build_id\":\"$BUILD_ID\",\"status\":\"failed\",\"error\":\"Build failed — check Actions logs.\"}"

      - name: Clean up payload files
        if: always()
        run: |
          git config user.name "knanguz-bot"
          git config user.email "bot@knanguz.local"
          git rm -f "$PAYLOAD_PATH" || true
          [ -n "$ICON_PATH" ] && git rm -f "$ICON_PATH" || true
          git commit -m "knanGuz: clean up payload for $BUILD_ID" || true
          git push || true
